name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check src tests

      - name: Vérification de types
        run: mypy src

      # Le pipeline tourne avant les tests : les tests de non-régression
      # travaillent sur des données réellement produites, pas simulées.
      - name: Générer le jeu de démonstration
        run: abrip demo bootstrap

      - name: Vérifier le rappel sur la vérité terrain
        run: abrip demo verify

      - name: Tests
        run: pytest -q

  frontend:
    name: Compilation du frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Vérification de types
        run: npm run typecheck

      - run: npm run build

      # Le budget de bundle est un engagement du cahier des charges : il est
      # vérifié automatiquement, sinon il dérive au fil des dépendances.
      - name: Vérifier le budget de bundle (250 Ko compressés)
        run: |
          TAILLE=$(find dist/assets \( -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 gzip -c | wc -c)
          echo "Total transféré : $((TAILLE / 1024)) Ko compressés"
          if [ "$TAILLE" -gt 256000 ]; then
            echo "Budget dépassé"
            exit 1
          fi

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      # La construction exécute `abrip demo verify` : une détection cassée
      # empêche l'image d'exister, donc empêche le déploiement.
      - name: Construire
        run: docker build -t abrip:${{ github.sha }} .

      - name: Démarrer et interroger le service
        run: |
          docker run -d --name abrip -p 7860:7860 abrip:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/api/health > /dev/null; then
              echo "Service en ligne"
              curl -s http://localhost:7860/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Le service n'a pas démarré"
          docker logs abrip
          exit 1
