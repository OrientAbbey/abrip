name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer le projet depuis le verrou
        run: uv sync --locked --all-extras

      - name: Audit des dépendances Python
        run: uv run --locked pip-audit --progress-spinner off

      - name: Linter
        run: uv run --locked ruff check src tests

      - name: Formatage
        run: uv run --locked ruff format --check src tests

      - name: Vérification de types
        run: uv run --locked mypy src

      # Le pipeline tourne avant les tests : les tests de non-régression
      # travaillent sur des données réellement produites, pas simulées.
      - name: Générer le jeu de démonstration
        run: uv run --locked abrip demo bootstrap

      - name: Vérifier le rappel sur la vérité terrain
        run: uv run --locked abrip demo verify

      - name: Tests
        run: >
          uv run --locked pytest -q --cov=abrip
          --cov-report=term-missing --cov-report=xml:coverage.xml

      # Le rapport XML est conservé même si les tests échouent : il permet de
      # voir ce qui a régressé sans relancer la suite localement.
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Compilation du frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Audit des dépendances npm
        run: npm audit --audit-level=high

      - name: Tests frontend
        run: npm test

      - name: Vérification de types
        run: npm run typecheck

      - run: npm run build

      # Le budget de bundle est un engagement du cahier des charges : il est
      # vérifié automatiquement, sinon il dérive au fil des dépendances.
      - name: Vérifier le budget de bundle (270 000 octets gzip)
        run: |
          TAILLE=$(find dist/assets \( -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 gzip -c | wc -c)
          echo "Total transféré : $TAILLE octets gzip"
          if [ "$TAILLE" -gt 270000 ]; then
            echo "Budget dépassé"
            exit 1
          fi

  e2e:
    name: Parcours navigateur
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le projet depuis le verrou
        run: uv sync --locked --all-extras

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Compiler le frontend
        run: npm run build
        working-directory: frontend

      # Le service sert `frontend/dist` sur la même origine que l'API ; le jeu
      # de démonstration fournit des données déterministes aux parcours.
      - name: Générer le jeu de démonstration
        run: uv run --locked abrip demo bootstrap

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Parcours critiques
        run: npm run test:e2e
        working-directory: frontend

      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [python, frontend, e2e]
    steps:
      - uses: actions/checkout@v7

      # La construction exécute `abrip demo verify` : une détection cassée
      # empêche l'image d'exister, donc empêche le déploiement.
      - name: Construire
        run: docker build -t abrip:${{ github.sha }} .

      - name: Démarrer et interroger le service
        run: |
          docker run -d --name abrip -p 7860:7860 abrip:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/api/health > /dev/null; then
              echo "Service en ligne"
              curl -s http://localhost:7860/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Le service n'a pas démarré"
          docker logs abrip
          exit 1
