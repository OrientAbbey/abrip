name: Réveil du service

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête de santé
        env:
          ABRIP_HEALTH_URL: ${{ secrets.ABRIP_HEALTH_URL }}
        run: |
          if [ -n "$ABRIP_HEALTH_URL" ]; then
            curl --fail --silent --show-error --max-time 30 "$ABRIP_HEALTH_URL" > /dev/null
          else
            echo "ABRIP_HEALTH_URL non configuré, rien à faire."
          fi
