# Hooks facultatifs : installer avec `pipx install pre-commit` puis
# `pre-commit install`. Les versions des outils sont celles du pyproject, pour
# que le poste de travail et la CI voient la même chose.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src
        language: system
        pass_filenames: false
        types: [python]
