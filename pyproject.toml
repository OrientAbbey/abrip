[project]
name = "abrip"
version = "0.1.0"
description = "African BGP Routing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Orient Francis James Abbey Abbey" }]

# Versions exactes : une borne basse seule laisse le CI résoudre des versions
# différentes de celles testées localement, ce qui change parfois le forme des
# réponses JSON ou la performance perçue par l'interface. Ces pins sont ceux de
# l'environnement de référence (Python 3.12).
dependencies = [
  "polars==2.1.0",
  "duckdb==2.0.0",
  "pyarrow==26.0.1",
  "numpy==2.5.5",
  "fastapi==0.163.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "httpx==0.28.1",
  "typer==0.29.1",
  "rich==15.0.0",
  "pyyaml==6.0.3",
  "tenacity==9.2.1",
  "orjson==3.13.0",
  "networkx==3.7",
]

[project.optional-dependencies]
bgpkit = ["pybgpkit-parser==0.24.0"]
mrt = ["mrtparse==2.2.0"]
live = ["websockets==17.4"]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  # Outillage épinglé : les règles évoluent vite d'une version à l'autre, une
  # borne basse seule rend le lint et le typecheck non reproductibles (le CI
  # réinstallerait systématiquement la dernière version).
  "ruff==0.17.5",
  "mypy==2.4.1",
]

[project.scripts]
abrip = "abrip.cli:app"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# B008 (appel de fonction en défaut d'argument) est le motif obligatoire de
# FastAPI pour l'injection de dépendances (`Query`, `Depends`, `Header`) :
# ce n'est pas une erreur ici.
[tool.ruff.lint.per-file-ignores]
"src/abrip/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Starlette déprécie l'usage d'httpx avec TestClient (invitation à migrer vers
# httpx2). C'est un bruit tiers à l'import de fastapi.testclient : on ne peut
# pas le faire disparaître côté projet, on le filtre pour ne pas masquer de
# vrais avertissements.
filterwarnings = [
  "ignore:Using .*httpx.*with .*starlette.testclient.* is deprecated:DeprecationWarning",
]
