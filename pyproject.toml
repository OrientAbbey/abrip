[project]
name = "abrip"
version = "0.1.0"
description = "African BGP Routing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orient Francis James Abbey Abbey" }]

dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=16.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tenacity>=8.5",
  "orjson>=3.10",
  "networkx>=3.3",
]

[project.optional-dependencies]
bgpkit = ["pybgpkit-parser>=0.18"]
mrt = ["mrtparse>=2.2"]
live = ["websockets>=12.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  # Outillage épinglé : les règles évoluent vite d'une version à l'autre, une
  # borne basse seule rend le lint et le typecheck non reproductibles (le CI
  # réinstallerait systématiquement la dernière version).
  "ruff==0.16.8",
  "mypy==2.3.1",
]

[project.scripts]
abrip = "abrip.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# B008 (appel de fonction en défaut d'argument) est le motif obligatoire de
# FastAPI pour l'injection de dépendances (`Query`, `Depends`, `Header`) :
# ce n'est pas une erreur ici.
[tool.ruff.lint.per-file-ignores]
"src/abrip/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
